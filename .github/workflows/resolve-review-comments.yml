name: Resolve review comments

on:
  pull_request_review:
    types: [submitted]
  # Manual runs apply the workflow to an earlier review.
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
      review-id:
        description: Review ID
        required: true

permissions:
  contents: read

jobs:
  resolve:
    uses: petrubraha/comment-resolver-agent/.github/workflows/resolve-review-comments.yml@v1
    with:
      # The shared workflow prefers the Client ID and falls back to the App ID.
      client-id: ${{ vars.APP_CLIENT_ID }}
      app-id: ${{ vars.APP_ID }}
      pr-number: ${{ inputs.pr-number }}
      review-id: ${{ inputs.review-id }}
      gemini-model: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      commit-types: feat fix doc test ci chore
      instructions: |-
        This repository holds Agent Skills: each skill is a folder with a `SKILL.md` file, and its YAML
        frontmatter must stay valid. Before editing any text, read `write-prose/SKILL.md` and follow its rules.
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
